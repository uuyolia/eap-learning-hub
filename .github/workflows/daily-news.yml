name: Publish EAP briefings
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eap-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare public website files
        run: |
          mkdir -p _site
          cp index.html app.js app.css exam-core.js exam.js _site/
          cp -r data assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          name: eap-learning-site-${{ github.run_attempt }}
          path: _site
      - name: Deploy website
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: eap-learning-site-${{ github.run_attempt }}
      - name: Allow artifact metadata to become available
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry deployment after transient artifact errors
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: eap-learning-site-${{ github.run_attempt }}
